dcb:
  peer-auth:
    enabled: true
    ncip:
      enabled: true
    remote-jwks:
      connect-timeout: PT1S
      read-timeout: PT3S
    local-identity:
      id: dcb
      issuer: https://dcb.example/peer-auth
      subject: ORS:DCB
      key-id: key-1
      public-jwk: public
      private-jwk: private
      token-lifetime: PT5M
