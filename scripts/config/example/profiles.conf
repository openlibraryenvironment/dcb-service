# Config profiles: name = comma-separated group directories.
# Selected with --config <name>. "all" is built in.
#
# To add a vendor: create the group directory with its NN-<kind> step
# directories, then add a line here.

folio=folio
sierra=sierra

# Koha is the one vendor needing two URLs: api-url for the REST API, commonly
# the staff interface, and base-url for the OPAC, which is where oai.pl is
# served from. See docs/koha_notes.md.
koha=koha

# Profiles A/B: a library whose primitives come from NCIP (and optionally a
# vendor API), served by FoundationClient. Still imperative.
foundation=foundation

# Profile D: a library fronted by an external ORS Appliance. Declarative
# placement + event-driven tracking rather than an imperative vendor client.
ors=ors
