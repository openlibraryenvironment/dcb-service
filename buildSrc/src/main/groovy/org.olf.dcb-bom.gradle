dependencies {
	constraints {
		
		// Define dependency versions as constraints 
	  
		implementation 'org.marc4j:marc4j:2.9.5'
		implementation 'info.debatty:java-string-similarity:2.0.0'
	  // opensearch-java / opensearch-rest-client versions are NOT pinned here on
	  // purpose. They come from micronaut-opensearch-bom 2.1.0, imported in
	  // dcb/build.gradle, which manages 3.9.0 / 3.7.0 -- the first releases with a
	  // Jackson 3 mapper. Pinning them here as well would put us ahead of the
	  // Micronaut BOM again and re-introduce the drift this replaced.
	  implementation 'info.debatty:java-string-similarity:2.0.0'
	  
	  
		// These are needed to address critical CVEs that block deployment
		implementation("io.netty:netty-bom:4.1.118.Final")
		implementation("org.apache.httpcomponents.client5:httpclient5:5.4.4")
		implementation("org.apache.httpcomponents:httpasyncclient:4.1.5")
		implementation("org.apache.httpcomponents:httpclient:4.5.14")
		implementation("commons-beanutils:commons-beanutils:1.11.0")
		implementation("com.fasterxml.jackson.core:jackson-databind:2.20.1")
		implementation("com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.20.1")
	
	  runtimeOnly("ch.qos.logback.contrib:logback-json-classic:0.1.5")
	  runtimeOnly("ch.qos.logback.contrib:logback-jackson:0.1.5")
		
		
		implementation 'org.apache.http:httpcore:4.2'
		
		
		implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
		implementation 'org.apache.lucene:lucene-queryparser:9.7.0'

	// 5.4.0 is the last release whose CP subsystem works in the Community edition.
	// From 5.5.0 onward getCPSubsystem().getLock(...) resolves to CPSubsystemStubImpl,
	// which throws "CP subsystem is a licensed feature. Please ensure you have an
	// Enterprise license that enables CP." -- that breaks HazelcastFederatedLockService
	// and therefore every federated lock (ingest, clustering housekeeping, tracking).
	//
	// This MUST be `strictly`. As a plain constraint it was silently overridden:
	// micronaut-platform 5.0.2 pulls micronaut-cache-bom 6.0.0, which manages Hazelcast
	// to 5.6.0, and Gradle resolved 5.4.0 -> 5.6.0. Nothing here uses Hazelcast caching
	// (DCB uses micronaut-cache-caffeine); the cache BOM merely manages the version.
		implementation('com.hazelcast:hazelcast') {
			version { strictly '5.4.0' }
			because 'CP subsystem is Enterprise-only from Hazelcast 5.5.0'
		}
		implementation 'guru.nidi:graphviz-java-all-j2v8:0.18.1'
		implementation 'com.graphql-java:graphql-java-extended-scalars:22.0'
		implementation 'com.opencsv:opencsv:5.8'

		// Tests
		
		testImplementation "org.junit:junit-bom:5.10.0"
//		testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
		testImplementation 'org.mock-server:mockserver-junit-jupiter:5.14.0'
		testImplementation('com.networknt:json-schema-validator') {
			version {
				strictly '1.0.72'
			}
			because 'MockServer 5.14.0 references SpecVersion.VersionFlag, which was removed in json-schema-validator 3.x'
		}
		testImplementation('org.awaitility:awaitility:4.2.0')
	}
}
